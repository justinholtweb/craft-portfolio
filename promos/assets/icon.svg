<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Portfolio">
  <!--
    Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the family's shape.
    Tile radius 22.44%, matching Appleseed's rx="35" on a 156px square.

    The mark is a portfolio grid: four pieces of work in a masonry layout, the tallest with a
    picture cut out of it. That is what the plugin builds and what craft.portfolio.grid() draws.
    One path with fill-rule="evenodd", so the picture is a hole rather than a second colour, and
    src/icon-mask.svg is the same path unchanged.

    Plum #93348C sits at ~304° — the hue gap in the family between Xplain's orchid (286°) and
    Toss's magenta (321°).
  -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#93348C"/>
  <path fill="#FEFEFE" fill-rule="evenodd" d="M23,18 H43 A5,5 0 0 1 48,23 V51 A5,5 0 0 1 43,56 H23 A5,5 0 0 1 18,51 V23 A5,5 0 0 1 23,18 Z M57,18 H77 A5,5 0 0 1 82,23 V35 A5,5 0 0 1 77,40 H57 A5,5 0 0 1 52,35 V23 A5,5 0 0 1 57,18 Z M23,60 H43 A5,5 0 0 1 48,65 V77 A5,5 0 0 1 43,82 H23 A5,5 0 0 1 18,77 V65 A5,5 0 0 1 23,60 Z M57,44 H77 A5,5 0 0 1 82,49 V77 A5,5 0 0 1 77,82 H57 A5,5 0 0 1 52,77 V49 A5,5 0 0 1 57,44 Z M62.5,51.5 A4,4 0 1 0 62.5,59.5 A4,4 0 1 0 62.5,51.5 Z M56.5,76 L64.5,65 L69,70.5 L72.5,66.5 L77.5,76 Z"/>
</svg>
